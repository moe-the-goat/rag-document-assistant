<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="btn primary-btn">
                    <span class="icon">✨</span> New Chat
                </button>
                <button id="toggle-sidebar" class="btn icon-btn" title="Close Sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>

            <div class="sidebar-content">
                <section class="sidebar-section">
                    <h3>Conversations</h3>
                    <div id="conversations-list" class="list-container">
                        <!-- Convos injected here -->
                    </div>
                </section>

                <section class="sidebar-section">
                    <h3>Library</h3>
                    <div id="document-library" class="list-container">
                        <!-- Docs injected here -->
                    </div>
                </section>
            </div>

            <div class="sidebar-footer">
                <!-- Settings or other footer items can go here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div id="toast-container" class="toast-container"></div>
            <header class="chat-header">
                <button id="open-sidebar" class="btn icon-btn" style="display:none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="header-title">
                    <h2>Nexus AI</h2>
                    <span id="current-chat-title" class="subtitle">New Conversation</span>
                </div>
            </header>

            <div class="messages-container" id="messages-container">
                <!-- Welcome Message -->
                <div id="welcome-screen" class="welcome-screen">
                    <h1 style="font-size: 2.5rem; font-weight: 400; color: #e3e3e3; margin-bottom: 32px;">Hi, what's the move?</h1>
                </div>
                <!-- Chat Bubbles injected here -->
            </div>

            <div class="input-area-wrapper">
                <input type="file" id="file-input" accept=".pdf,.txt,.docx,.md,.html" style="display:none">
                <div class="input-container">
                    <button id="upload-plus-btn" class="btn icon-btn" title="Upload Document" onclick="document.getElementById('file-input').click()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <textarea id="chat-input" placeholder="Ask Nexus AI..." rows="1"></textarea>
                    <div class="model-selector-pill">
                        <select id="model-select" class="pill-select">
                            <option value="qwen2.5:latest">qwen2.5:latest</option>
                            <option value="qwen3:4b">qwen3:4b</option>
                        </select>
                    </div>
                    <button id="send-btn" class="btn icon-btn send-btn" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="input-footer">
                    <div class="footer-text">
                        Answers are generated locally. All data stays on your machine.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
