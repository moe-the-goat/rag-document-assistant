<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar closed" id="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="btn primary-btn">
                    <span class="icon">✨</span> New Chat
                </button>
                <button id="toggle-sidebar" class="btn icon-btn" title="Close Sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>

            <div class="sidebar-content">
                <section class="sidebar-section">
                    <h3>Conversations</h3>
                    <div id="conversations-list" class="list-container">
                        <!-- Convos injected here -->
                    </div>
                </section>

                <section class="sidebar-section">
                    <h3>Library</h3>
                    <div id="document-library" class="list-container">
                        <!-- Docs injected here -->
                    </div>
                </section>
            </div>

            <div class="sidebar-footer">
                <!-- Settings or other footer items can go here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area chat-empty">
            <div id="toast-container" class="toast-container"></div>
            <header class="chat-header">
                <button id="open-sidebar" class="btn icon-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="brand-container">
                    <img src="icon.svg" alt="Nexus AI Logo" class="nexus-icon" />
                    <div class="text-group">
                        <h1 class="brand-name">Nexus AI</h1>
                        <p class="conversation-status" id="current-chat-title">New Conversation</p>
                    </div>
                </div>
            </header>

            <div class="messages-container" id="messages-container">
                <!-- Welcome Message -->
                <div id="welcome-screen" class="welcome-screen">
                    <h1 style="font-size: 2.2rem; font-weight: 400; color: #e3e3e3; margin-bottom: 32px;">Any new ideas to explore?</h1>
                </div>
                <!-- Chat Bubbles injected here -->
            </div>

            <div class="input-area-wrapper">
                <input type="file" id="file-input" accept=".pdf,.txt,.docx,.md,.html" style="display:none">
                <div class="input-container">
                    <button id="upload-plus-btn" class="btn icon-btn" title="Upload Document" onclick="document.getElementById('file-input').click()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <textarea id="chat-input" placeholder="Ask Nexus AI..." rows="1"></textarea>
                    <div class="model-selector-container" id="model-selector-container">
                        <button id="model-select-btn" class="pill-select">
                            <span id="selected-model-text">qwen2.5:latest</span>
                        </button>
                        <div id="model-dropdown" class="custom-dropdown">
                            <div class="dropdown-item selected" data-value="qwen2.5:latest">
                                <div class="dropdown-title">qwen2.5:latest</div>
                                <div class="dropdown-desc">All-around help and coding</div>
                            </div>
                            <div class="dropdown-item" data-value="qwen3:4b">
                                <div class="dropdown-title">qwen3:4b</div>
                                <div class="dropdown-desc">Fastest answers</div>
                            </div>
                        </div>
                    </div>
                    <button id="send-btn" class="btn icon-btn send-btn" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
            <div class="input-footer">
                <div class="footer-text">
                    Answers are generated locally. All data stays on your machine.
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
