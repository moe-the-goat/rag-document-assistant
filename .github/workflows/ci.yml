name: QA Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Test with pytest
      run: |
        python -m pytest --cov=app tests/

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Test Docker Backend Build
      run: docker build -t rag-backend -f Dockerfile.backend .

    - name: Test Docker Frontend Build
      run: docker build -t rag-frontend -f Dockerfile.frontend .
